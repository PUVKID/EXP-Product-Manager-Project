<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BunjangAuto 관리자 센터</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <div class="card login-card">
    <h1>BunjangAuto 관리자 센터</h1>
    <p class="muted">© 음악천재 · 관리자 전용</p>
    <label>아이디<input id="lu" autocomplete="username"></label>
    <label>비밀번호<input id="lp" type="password" autocomplete="current-password"></label>
    <div id="lerr" class="err"></div>
    <button id="lbtn" class="primary">로그인</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand">BunjangAuto<small>관리자 센터</small></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="theme" class="ghost">테마: 시스템</button>
      <button id="logout" class="ghost">로그아웃</button>
    </div>
  </aside>
  <main>
    <header><h2 id="title"></h2><span id="clock" class="muted"></span></header>
    <section id="view"></section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
